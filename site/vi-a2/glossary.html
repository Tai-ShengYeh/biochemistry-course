<style>
:root{--primary:#1F4E5F;--secondary:#2E7D8A;--accent:#C8532B;--bg:#F7FBFC;--text:#1F2933;--border:#D9E7EC;--muted:#7A8C93}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--primary);color:#fff;padding:1.6rem 1rem;border-bottom:6px solid var(--accent)}
.wrap{max-width:1000px;margin:0 auto;padding:0 1rem}
header h1{margin:0;font-size:1.5rem}
header p{margin:.35rem 0 0;color:#9FD3DE;font-size:.85rem}
header a.back{color:#cfeef4;font-size:.82rem;text-decoration:none}
header a.back:hover{text-decoration:underline}
main{padding:1.2rem 0 3rem}
.controls{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1rem;margin:1rem 0;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;gap:.7rem;flex-wrap:wrap}
.controls input[type=search]{flex:1 1 220px;padding:.6rem .8rem;border:1px solid var(--border);border-radius:7px;font-size:1rem;font-family:inherit}
.controls select{padding:.6rem .8rem;border:1px solid var(--border);border-radius:7px;font-size:.95rem;font-family:inherit;background:#fff}
.count{color:var(--muted);font-size:.85rem;margin:0 0 .6rem;padding:0 .2rem}
.tablewrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
thead th{background:var(--primary);color:#fff;text-align:left;padding:.6rem .7rem;font-size:.82rem;position:sticky;top:0;white-space:nowrap}
tbody td{padding:.55rem .7rem;border-top:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:#F0F8FA}
tbody tr:nth-child(even){background:#FBFEFE}
tbody tr:nth-child(even):hover{background:#F0F8FA}
.zh{font-weight:600;color:var(--primary);white-space:nowrap}
.py{display:block;font-weight:400;color:var(--muted);font-size:.76rem;margin-top:.1rem}
.wk{color:#fff;background:var(--secondary);border-radius:999px;padding:.1rem .55rem;font-size:.72rem;white-space:nowrap;display:inline-block}
.note{color:var(--muted);font-size:.78rem;margin-top:.15rem}
.spk{border:none;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:1rem;padding:.2rem .45rem;line-height:1}
.spk:hover{border-color:var(--secondary)}
.spk:active{transform:scale(.92)}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
footer{border-top:1px solid var(--border);padding:1.2rem;text-align:center;color:var(--muted);font-size:.8rem}
@media (max-width:640px){
  table,thead,tbody,tr,td,th{display:block}
  thead{display:none}
  tbody tr{border:1px solid var(--border);border-radius:8px;margin:.6rem;padding:.6rem .8rem;position:relative}
  tbody td{border:none;padding:.15rem 0}
  tbody td::before{content:attr(data-label);display:inline-block;min-width:3.6em;color:var(--muted);font-size:.72rem}
  .tablewrap{background:transparent;box-shadow:none;border:none}
  .spk{position:absolute;top:.5rem;right:.6rem}
}
</style>
</head>

var rowsEl = document.getElementById('rows');
var qEl = document.getElementById('q');
var weekSel = document.getElementById('weekSel');
var emptyMsg = document.getElementById('emptyMsg');
var countLabel = document.getElementById('countLabel');

document.getElementById('totalCount').textContent = DATA.length;

var weeks = Array.from(new Set(DATA.map(function(r){ return r.week; }))).sort(function(a,b){ return a-b; });
weeks.forEach(function(w){
  var opt = document.createElement('option');
  opt.value = w;
  opt.textContent = '第 ' + w + ' 週';
  weekSel.appendChild(opt);
});

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];
  });
}

function norm(s){ return String(s || '').toLowerCase(); }

function speak(zh){
  try {
    if (!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(zh);
    u.lang = 'zh-TW';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
window.speak = speak;

function render(){
  var q = norm(qEl.value.trim());
  var wk = weekSel.value;
  var filtered = DATA.filter(function(r){
    if (wk && String(r.week) !== wk) return false;
    if (!q) return true;
    return norm(r.zh).indexOf(q) > -1 ||
           norm(r.py).indexOf(q) > -1 ||
           norm(r.vi).indexOf(q) > -1 ||
           norm(r.en).indexOf(q) > -1;
  });
  countLabel.textContent = '顯示 ' + filtered.length + ' / ' + DATA.length + ' 筆';
  if (!filtered.length) {
    rowsEl.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  var html = '';
  filtered.forEach(function(r){
    html += '<tr>' +
      '<td data-label="中文"><span class="zh">' + esc(r.zh) + '<span class="py">' + esc(r.py) + '</span></span></td>' +
      '<td data-label="越南文">' + esc(r.vi) + '</td>' +
      '<td data-label="英文">' + esc(r.en) + (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '') + '</td>' +
      '<td data-label="週次"><span class="wk">W' + esc(r.week) + '</span></td>' +
      '<td data-label="發音"><button class="spk" onclick="speak(' + JSON.stringify(String(r.zh)) + ')" title="播放中文發音">🔊</button></td>' +
      '</tr>';
  });
  rowsEl.innerHTML = html;
}

qEl.addEventListener('input', render);
weekSel.addEventListener('change', render);
render();
</script>
